<svg xmlns="http://www.w3.org/2000/svg" width="940" height="310" viewBox="0 0 940 310" role="img" aria-labelledby="title desc"><title id="title">Cloud9 NOMAD Community features</title><desc id="desc">Project NOMAD upstream plus five portable community upgrades: responsive dashboard, English / English / French interface, Chinese docs, offline navigation, configurable AI, low power display</desc><rect width="940" height="310" rx="22" fill="#0c192e"/><rect x="28" y="91" width="263" height="122" rx="16" stroke="#6c87ac" stroke-width="2" fill="#1b3150"/><text x="50" y="137" fill="#f2f7ff" font-family="system-ui" font-size="24" font-weight="bold">PROJECT NOMAD</text><text x="50" y="170" fill="#b2c7e3" font-family="system-ui" font-size="15">Original offline-first platform</text><path d="M299 152h66" stroke="#54dec1" stroke-width="4"/><path d="M355 143l15 9-15 9" stroke="#54dec1" stroke-width="4" fill="none"/><rect x="383" y="30" width="525" height="252" rx="19" stroke="#51cfb0" stroke-width="2" fill="#153b43"/><text x="406" y="69" fill="#f3fff9" font-family="system-ui" font-weight="bold" font-size="23">Cloud9-NOMAD Community</text><text x="408" y="105" fill="#c7f4e7" font-family="system-ui" font-size="16">Dashboard search, favorites and low-power layout</text><text x="408" y="140" fill="#c7f4e7" font-family="system-ui" font-size="16">EN / FR interface · 中文 documentation (not UI)</text><text x="408" y="175" fill="#c7f4e7" font-family="system-ui" font-size="16">Offline education, medical and resilience navigation</text><text x="408" y="210" fill="#c7f4e7" font-family="system-ui" font-size="16">Configurable remote OpenAI-style gateway / embeddings</text><text x="408" y="245" fill="#d3edff" font-family="system-ui" font-size="14">Portable · Apache-2.0 · no private deployment data</text></svg>